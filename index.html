<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은채의 🍀합격🍀을 위한 면접 연습기</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nanum Gothic', sans-serif;
        }

        body {
            background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('https://i.namu.wiki/i/G3hc2h4AbOwG98IZSnz_07JRjDFciIPEtzIABy4KJhTrpIMCbSZtq8vey74byVrgouvCn-2iUbpBTPhdVRf46A.svg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            -webkit-overflow-scrolling: touch;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Jua', sans-serif;
            font-size: 2.8rem;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            padding: 15px 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.6rem;
            color: white;
            font-family: 'Jua', sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 10px;
        }

        .timer-container {
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .timer-controls {
            display: flex;
            gap: 15px;
        }

        .timer-controls button {
            background-color: white;
            color: #1e5799;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .timer-controls button:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .tab-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #555;
            border-bottom: 3px solid transparent;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .tab:hover {
            background-color: #f5f5f5;
            color: #1e5799;
        }

        .tab:active {
            background-color: #e8f4fd;
            transform: scale(0.98);
        }

        .tab.active {
            color: #1e5799;
            border-bottom-color: #1e5799;
            background-color: #f0f8ff;
        }

        .flashcard {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            min-height: 400px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .set-title {
            display: none;
        }

        .question {
            font-size: 2rem;
            margin: 60px auto 30px;
            text-align: center;
            color: #1e5799;
            font-weight: bold;
            max-width: 90%;
            position: relative;
            line-height: 1.4;
        }

        .question::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #1e5799, transparent);
        }

        .answer-section {
            margin-top: 30px;
            display: none;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e5799;
        }

        .bookmark-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 50%;
            min-width: 50px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .bookmark-button:hover {
            background-color: rgba(0, 0, 0, 0.1);
            transform: scale(1.1);
        }

        .bookmark-button.active {
            color: #ffcc00;
            background-color: rgba(255, 204, 0, 0.1);
            animation: pulse 1s ease;
        }

        .bookmark-button:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #1e5799 0%, #207cca 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(30, 87, 153, 0.3);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(30, 87, 153, 0.4);
        }

        .nav-button:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 15px rgba(30, 87, 153, 0.4);
        }

        .hidden {
            display: none;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
            resize: vertical;
            font-family: 'Nanum Gothic', sans-serif;
        }

        .save-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button:hover {
            background: #45a049;
        }

        /* ����??����????��??*/
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                gap: 20px;
            }

            h1 {
                font-size: 2.2rem;
                padding: 12px 20px;
            }

            h2 {
                font-size: 1.4rem;
                padding: 8px 15px;
            }

            .timer {
                font-size: 2rem;
            }

            .timer-controls {
                flex-direction: row;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .timer-controls button {
                flex: 1;
                min-width: 80px;
                font-size: 0.85rem;
                padding: 8px 10px;
            }

            .tabs {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .tab {
                font-size: 0.75rem;
                padding: 10px 6px;
                min-height: 40px;
                flex: 1;
                min-width: 80px;
            }

            .flashcard {
                padding: 30px 20px;
                min-height: 350px;
            }

            .question {
                font-size: 1.6rem;
                margin: 50px auto 25px;
            }

            .answer-tabs {
                flex-direction: row;
                gap: 8px;
                margin: 30px auto;
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 1;
                min-width: 80px;
                font-size: 0.85rem;
                padding: 10px 12px;
            }

            .navigation {
                flex-direction: row;
                gap: 8px;
                flex-wrap: wrap;
            }

            .nav-button {
                flex: 1;
                min-width: 80px;
                font-size: 0.9rem;
                padding: 10px 12px;
            }

            .bookmark-button {
                top: 15px;
                right: 15px;
                font-size: 1.8rem;
                min-width: 45px;
                min-height: 45px;
                padding: 8px;
            }

            .example-answer-section {
                max-height: 250px;
                padding: 20px;
            }

            .section-title {
                font-size: 1.1rem;
            }

            .example-answer-content {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                padding: 10px 15px;
            }

            h2 {
                font-size: 1.2rem;
                padding: 6px 12px;
            }

            .question {
                font-size: 1.4rem;
                margin: 40px auto 20px;
            }

            .flashcard {
                padding: 25px 15px;
                min-height: 300px;
            }

            .bookmark-button {
                font-size: 1.6rem;
                min-width: 40px;
                min-height: 40px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

            <div class="navigation">

        const questionsData = [
    {
        id: "Q-1",

        keywords: "",
        answer: "초등학교 때부터 사람의 심리에 관심이 많아 가족과 함께 독거노인 반찬 배달, 마을회관 방문 등 봉사활동을 하며 '도움이 사람의 관계 속에서 이어지는 일'이라는 걸 배웠습니다. 고등학교에서는 교육청 차원 봉사활동 팀장을 맡아 프로그램을 기획·운영하면서 '전문적으로 타인을 지원하는 방법'을 배우고 싶다는 생각을 갖게 되었습니다. [2학년 자율활동/봉사]",

    {

        keywords: "",
        answer: "사회복지사는 내담자의 신뢰를 얻어야 하기에 공감력과 경청이 필수라고 생각합니다. '공감'은 상대의 감정을 그대로 느끼는 것이고, '경청'은 말보다 태도로 신뢰를 주는 과정입니다. 저는 친구의 고민을 듣고 문제를 함께 해결해 나간 경험이 많아 이런 부분을 강점으로 생각합니다. [3학년 진로활동]",

    {

        interviewIntent: "가장 기억에 남는 봉사 경험",

    {
        id: "Q-4",

        text: "사회복지 분야 중에서 특별히 관심 있는 세부 분야가 있나요?",
        keywords: "",
        answer: "저는 정신·심리복지 분야에 가장 큰 관심이 있습니다. 사람의 감정과 마음을 이해하는 과정에서 많은 문제의 출발점이 있다는 것을 느꼈기 때문입니다. 심리학 관련 독서와 상담 특강을 들으며 내담자의 마음을 공감하는 방법을 배우고 싶어졌습니다. [1학년 동아리활동/독서]",

        keywords: "",
        answer: "사회복지는 단순히 도움을 주는 것이 아니라, 누구나 인간다운 삶을 누릴 '권리'를 보장하는 제도적 장치라고 생각합니다. 기초생활보장제도의 낙인효과를 탐구하면서, 복지는 수혜가 아니라 사회구성원의 '정당한 권리'임을 깨달았습니다. [2학년 동아리활동]",

        answer: "복지제도 이용자가 사회적으로 부정적 시선을 받기 때문입니다. 저는 인식 개선 캠페인을 통해 학생들이 복지 수혜자를 '권리의 주체'로 인식하도록 변화시킨 경험이 있습니다. 교육과 홍보가 낙인효과를 줄이는 첫걸음이라 생각합니다. [2학년 동아리활동]",

    {

        answer: "인력 부족 문제라고 생각합니다. 복지 수요는 급증하지만 전문 인력이 부족하여 서비스 질이 떨어집니다. 현장에서의 경험과 효율적 인력 운영 시스템 마련이 필요하다고 봅니다. [3학년 자율활동]",

        keywords: "",

        // questionSets 배열 형식으로 변환
        const questionSets = [{
            id: "MAIN",
            title: "",
            questions: questionsData
        }];

        // 전역 변수
        let currentMode = "sequential";
        let currentSetIndex = 0;
        let currentQuestionIndex = 0;
        let flatOrder = [];
        let currentFlatIndex = 0;
        let setOrder = Array.from({ length: questionSets.length }, (_, i) => i);
        let bookmarkedQuestions = [];
        let timerInterval;
        let seconds = 0;

        // DOM 요소
        let questionElement;
        const exampleAnswerContent = document.querySelector('.example-answer-content');
        const intentContent = document.querySelector('.intent-content');
        const exampleAnswerSection = document.querySelector('.example-answer-section');
        const intentSection = document.querySelector('.intent-section');
        const exampleTab = document.querySelector('.example-tab');
        const intentTab = document.querySelector('.intent-tab');
        const bookmarkButton = document.querySelector('.bookmark-button');
        const homeButton = document.getElementById('home');
        const prevButton = document.getElementById('prev');
        const nextButton = document.getElementById('next');
        const tabs = document.querySelectorAll('.tab');
        const timerElement = document.querySelector('.timer');
        const startTimerButton = document.getElementById('start-timer');
        const pauseTimerButton = document.getElementById('pause-timer');
        const resetTimerButton = document.getElementById('reset-timer');
        const setTitleElement = document.querySelector('.set-title');

        // 북마크 저장/불러오기
        function saveBookmarks() {
            localStorage.setItem('bookmarkedQuestions', JSON.stringify(bookmarkedQuestions));
        }

        function loadBookmarks() {
            const saved = localStorage.getItem('bookmarkedQuestions');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // 북마크 데이터 형식 검증
                    if (Array.isArray(parsed)) {
                        bookmarkedQuestions = parsed.filter(bookmark => 
                            bookmark && 
                            typeof bookmark.setId === 'string' && 
                            typeof bookmark.questionId === 'string'
                        );
                    } else {
                        bookmarkedQuestions = [];
                    }
                } catch (e) {
                    console.error('북마크 데이터 로드 실패:', e);
                    bookmarkedQuestions = [];
                }
            } else {
                bookmarkedQuestions = [];
            }
        }

        // 번호 정렬용 flatOrder 구축
        function buildFlatOrder() {
            const result = [];
            for (let si = 0; si < questionSets.length; si++) {
                const set = questionSets[si];
                for (let qi = 0; qi < set.questions.length; qi++) {
                    const q = set.questions[qi];
                    const numMatch = q.id.match(/Q-(\d+)/);
                    const sortKey = numMatch ? parseInt(numMatch[1], 10) : 9999;
                    result.push({ setIndex: si, questionIndex: qi, sortKey });
                }
            }
            return result;
        }

        // 배열 섞기
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 현재 문제 표시
        function displayCurrentQuestion() {
            questionElement = document.querySelector('.question');
            if (!questionElement) return;

            let currentSet, currentQuestion;

            if (currentMode === "bookmark" && bookmarkedQuestions.length > 0) {
                if (currentSetIndex >= bookmarkedQuestions.length) {
                    currentSetIndex = 0;
                }
                const bookmark = bookmarkedQuestions[currentSetIndex];
                if (!bookmark) {
                    questionElement.textContent = "문제를 찾을 수 없습니다.";
                    return;
                }
                currentSet = questionSets.find(set => set.id === bookmark.setId);
                if (!currentSet) {
                    questionElement.textContent = "문제를 찾을 수 없습니다.";
                    return;
                }
                currentQuestion = currentSet.questions.find(q => q.id === bookmark.questionId);
                if (!currentQuestion) {
                    questionElement.textContent = "문제를 찾을 수 없습니다.";
                    return;
                }
            } else if (currentMode === "sequential" || currentMode === "reverse") {
                if (!flatOrder || flatOrder.length === 0) {
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => a.sortKey - b.sortKey);
                    if (currentMode === "reverse") flatOrder.reverse();
                }
                if (currentFlatIndex >= flatOrder.length) {
                    currentFlatIndex = 0;
                }
                const flatItem = flatOrder[currentFlatIndex];
                currentSet = questionSets[flatItem.setIndex];
                currentQuestion = currentSet.questions[flatItem.questionIndex];
            } else {
                if (currentSetIndex >= setOrder.length) {
                    currentSetIndex = 0;
                }
                currentSet = questionSets[setOrder[currentSetIndex]];
                if (currentQuestionIndex >= currentSet.questions.length) {
                    currentQuestionIndex = 0;
                }
                currentQuestion = currentSet.questions[currentQuestionIndex];
            }

            if (!currentSet || !currentQuestion) {
                questionElement.textContent = "문제를 찾을 수 없습니다.";
                return;
            }

            // 문제 번호 추출
            const numMatch = currentQuestion.id.match(/Q-(\d+)/);
            const questionNumber = numMatch ? `${numMatch[1]}. ` : '';

            // 문제 표시
            questionElement.textContent = questionNumber + currentQuestion.text;
            if (exampleAnswerContent) exampleAnswerContent.textContent = currentQuestion.answer || '';
            if (intentContent) intentContent.textContent = currentQuestion.interviewIntent || '';

            // 북마크 상태 - 현재 질문이 북마크되어 있는지 정확히 확인
            if (currentSet && currentQuestion && bookmarkButton) {
                // 북마크 버튼의 active 클래스를 먼저 제거
                bookmarkButton.classList.remove('active');
                
                // 현재 질문이 북마크되어 있는지 확인
                const currentSetId = currentSet.id;
                const currentQuestionId = currentQuestion.id;
                
                const isBookmarked = bookmarkedQuestions.some(
                    bookmark => {
                        return bookmark.setId === currentSetId && bookmark.questionId === currentQuestionId;
                    }
                );
                
                if (isBookmarked) {
                    bookmarkButton.classList.add('active');
                }
            }

            // 답변 섹션은 사용자가 직접 탭 버튼으로 열고 닫을 수 있도록 자동으로 숨기지 않음
        }

        // 모드 설정
        function setMode(mode) {
            currentMode = mode;
            if (!questionSets || questionSets.length === 0) return;

            switch (mode) {
                case "sequential":
                    setOrder = Array.from({ length: questionSets.length }, (_, i) => i);
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => a.sortKey - b.sortKey);
                    currentFlatIndex = 0;
                    break;
                case "reverse":
                    setOrder = Array.from({ length: questionSets.length }, (_, i) => questionSets.length - 1 - i);
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => b.sortKey - a.sortKey);
                    currentFlatIndex = 0;
                    break;
                case "random":
                    setOrder = Array.from({ length: questionSets.length }, (_, i) => i);
                    shuffleArray(setOrder);
                    currentSetIndex = 0;
                    currentQuestionIndex = 0;
                    break;
                case "bookmark":
                    if (bookmarkedQuestions.length === 0) {
                        alert("북마크한 문제가 없습니다. 먼저 문제를 북마크해주세요.");
                        tabs.forEach(t => t.classList.remove('active'));
                        tabs[0].classList.add('active');
                        setMode("sequential");
                        return;
                    }
                    currentSetIndex = 0;
                    break;
            }
            displayCurrentQuestion();
        }

        // 북마크 토글
        function toggleBookmark() {
            let currentSet, currentQuestion;
            if (currentMode === "bookmark" && bookmarkedQuestions.length > 0) {
                if (currentSetIndex >= bookmarkedQuestions.length) {
                    currentSetIndex = 0;
                }
                const bookmark = bookmarkedQuestions[currentSetIndex];
                if (!bookmark) return;
                currentSet = questionSets.find(set => set.id === bookmark.setId);
                if (!currentSet) return;
                currentQuestion = currentSet.questions.find(q => q.id === bookmark.questionId);
                if (!currentQuestion) return;
            } else if (currentMode === "sequential" || currentMode === "reverse") {
                if (!flatOrder || flatOrder.length === 0) {
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => a.sortKey - b.sortKey);
                    if (currentMode === "reverse") flatOrder.reverse();
                }
                if (currentFlatIndex >= flatOrder.length) {
                    currentFlatIndex = 0;
                }
                const entry = flatOrder[currentFlatIndex];
                currentSet = questionSets[entry.setIndex];
                currentQuestion = currentSet.questions[entry.questionIndex];
            } else {
                if (currentSetIndex >= setOrder.length) {
                    currentSetIndex = 0;
                }
                currentSet = questionSets[setOrder[currentSetIndex]];
                if (currentQuestionIndex >= currentSet.questions.length) {
                    currentQuestionIndex = 0;
                }
                currentQuestion = currentSet.questions[currentQuestionIndex];
            }

            if (!currentSet || !currentQuestion) return;

            // 현재 질문의 ID를 명확하게 저장
            const currentSetId = currentSet.id;
            const currentQuestionId = currentQuestion.id;

            const bookmarkIndex = bookmarkedQuestions.findIndex(
                bookmark => {
                    return bookmark.setId === currentSetId && bookmark.questionId === currentQuestionId;
                }
            );

            if (bookmarkIndex === -1) {
                // 북마크 추가
                bookmarkedQuestions.push({ 
                    setId: currentSetId, 
                    questionId: currentQuestionId 
                });
                if (bookmarkButton) {
                    bookmarkButton.classList.add('active');
                }
            } else {
                // 북마크 제거
                bookmarkedQuestions.splice(bookmarkIndex, 1);
                if (bookmarkButton) {
                    bookmarkButton.classList.remove('active');
                }
                if (currentMode === "bookmark") {
                    if (bookmarkedQuestions.length === 0) {
                        alert("북마크한 문제가 없습니다. 번호순 모드로 전환합니다.");
                        tabs.forEach(t => t.classList.remove('active'));
                        tabs[0].classList.add('active');
                        setMode("sequential");
                        return;
                    }
                    if (currentSetIndex >= bookmarkedQuestions.length) {
                        currentSetIndex = bookmarkedQuestions.length - 1;
                    }
                    displayCurrentQuestion();
                }
            }
            saveBookmarks();
        }

        // 타이머 함수
        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            seconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            if (timerElement) {
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }
        }

        // 이벤트 리스너
        function addTouchEvents(element, handler) {
            if (!element) return;
            element.addEventListener('click', handler);
            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                handler();
            });
        }

        // 초기화
        loadBookmarks();

        // 탭 클릭
        tabs.forEach(tab => {
            const handleTabClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                setMode(tab.dataset.mode);
            };
            tab.addEventListener('click', handleTabClick);
            tab.addEventListener('touchend', handleTabClick);
        });

        // 네비게이션 버튼
        addTouchEvents(homeButton, () => {
            if (currentMode === "sequential" || currentMode === "reverse") {
                currentFlatIndex = 0;
            } else {
                currentSetIndex = 0;
                currentQuestionIndex = 0;
            }
            displayCurrentQuestion();
        });

        addTouchEvents(prevButton, () => {
            if (currentMode === "bookmark" && bookmarkedQuestions.length > 0) {
                currentSetIndex = (currentSetIndex - 1 + bookmarkedQuestions.length) % bookmarkedQuestions.length;
            } else if (currentMode === "sequential" || currentMode === "reverse") {
                if (!flatOrder || flatOrder.length === 0) {
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => a.sortKey - b.sortKey);
                    if (currentMode === "reverse") flatOrder.reverse();
                }
                currentFlatIndex = (currentFlatIndex - 1 + flatOrder.length) % flatOrder.length;
            } else {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                } else {
                    currentSetIndex = (currentSetIndex - 1 + setOrder.length) % setOrder.length;
                    currentQuestionIndex = questionSets[setOrder[currentSetIndex]].questions.length - 1;
                }
            }
            displayCurrentQuestion();
        });

        addTouchEvents(nextButton, () => {
            if (currentMode === "bookmark" && bookmarkedQuestions.length > 0) {
                currentSetIndex = (currentSetIndex + 1) % bookmarkedQuestions.length;
            } else if (currentMode === "sequential" || currentMode === "reverse") {
                if (!flatOrder || flatOrder.length === 0) {
                    flatOrder = buildFlatOrder();
                    flatOrder.sort((a, b) => a.sortKey - b.sortKey);
                    if (currentMode === "reverse") flatOrder.reverse();
                }
                currentFlatIndex = (currentFlatIndex + 1) % flatOrder.length;
            } else {
                const currentSet = questionSets[setOrder[currentSetIndex]];
                if (currentQuestionIndex < currentSet.questions.length - 1) {
                    currentQuestionIndex++;
                } else {
                    currentSetIndex = (currentSetIndex + 1) % setOrder.length;
                    currentQuestionIndex = 0;
                }
            }
            displayCurrentQuestion();
        });

        addTouchEvents(bookmarkButton, toggleBookmark);

        // 답변 탭
        const handleExampleTab = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (exampleAnswerSection) {
                // 다른 섹션은 숨기고
                if (intentSection) intentSection.classList.add('hidden');
                // 예시 답안 섹션은 토글
                exampleAnswerSection.classList.toggle('hidden');
            }
        };

        const handleIntentTab = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (intentSection) {
                // 다른 섹션은 숨기고
                if (exampleAnswerSection) exampleAnswerSection.classList.add('hidden');
                // 질문 의도 섹션은 토글
                intentSection.classList.toggle('hidden');
            }
        };

        if (exampleTab) {
            exampleTab.addEventListener('click', handleExampleTab);
            exampleTab.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleExampleTab(e);
            });
        }
        if (intentTab) {
            intentTab.addEventListener('click', handleIntentTab);
            intentTab.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleIntentTab(e);
            });
        }

        // 타이머 버튼
        addTouchEvents(startTimerButton, startTimer);
        addTouchEvents(pauseTimerButton, pauseTimer);
        addTouchEvents(resetTimerButton, resetTimer);

        // 초기 문제 표시
        if (questionSets && questionSets.length > 0) {
            flatOrder = buildFlatOrder();
            flatOrder.sort((a, b) => a.sortKey - b.sortKey);
            currentFlatIndex = 0;
            displayCurrentQuestion();
        }
    </script>
